# Canary loads this file as defaults only. Targets stay on the command line.
# Keep notification URLs and authorization headers in CANARY_* environment
# variables or a separately protected, untracked file.

retries = 2
recoveryThreshold = 2
json = false
# notify = ["https://hooks.example.invalid/private-token"]

[http]
timeout = 3000
status = 200
maxRedirects = 3
# verbose = true # Optional libcurl DNS/TCP/TLS/TTFB/transfer timings.
# statusRange = "2xx,304"
# maxLatency = 500
# responseHeader = "Content-Type: application/json"
# regex = "ready|healthy"
# jsonField = "service.status=ready"

[ssl]
timeout = 5000
minDays = 21
port = 443

[tcp]
timeout = 3000
# request = "PING\r\n"
# expected = "PONG"

[udp]
timeout = 3000
payload = "ping"

[dns]
timeout = 3000
type = "A"
# resolver = "1.1.1.1"
# expected = ["192.0.2.10", "192.0.2.11"]

[icmp]
timeout = 3000
count = 1
